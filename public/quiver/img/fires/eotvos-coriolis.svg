<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 480' width='820' height='480' role='img' aria-label='Eötvös effect is the upward part of the spin&#39;s push on a shell, Coriolis drift the part along the ground'>
<title>Eötvös effect is the upward part of the spin&#39;s push on a shell, Coriolis drift the part along the ground</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='820' height='480' fill='#ffffff'/>
<text x='410.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>EÖTVÖS AND CORIOLIS: ONE PUSH, TWO PARTS</text><text x='410.0' y='52' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>A shell fired east is pushed straight out from the Earth&#39;s axis; split that push along the ground and straight up</text>
<path d='M120,520 L120,120 A400,400 0 0 1 520,520 z' fill='#e8f1f8' stroke='#7fb3d5' stroke-width='6'/>
<path d='M120,130 L120,70' fill='none' stroke='#20261c' stroke-width='2.5' marker-end='url(#ah)'/>
<line x1='120' y1='520' x2='120' y2='120' stroke='#20261c' stroke-width='1.5' stroke-dasharray='6 5'/>
<text x='130' y='86' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c'>Earth&#39;s axis</text>
<text x='180' y='490' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#1565c0'>Earth</text>
<line x1='349.2832640852065' y1='170.95962295110695' x2='522.8359187005722' y2='377.791622593231' stroke='#6b7260' stroke-width='1.2' stroke-dasharray='4 4'/>
<line x1='426.41777724759123' y1='262.8849561253843' x2='579.6266658713869' y2='134.32743418807644' stroke='#6b7260' stroke-width='1.2' stroke-dasharray='4 4'/>
<text x='585.6266658713869' y='138.32743418807644' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#6b7260'>straight up</text>
<text x='343.2832640852065' y='174.95962295110695' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#6b7260'>along the ground</text>
<line x1='537.9143541259496' y1='169.32821958922455' x2='616.4177772475912' y2='262.8849561253843' stroke='#6b7260' stroke-width='1' stroke-dasharray='3 3'/>
<line x1='504.92120036923285' y1='356.44169266154404' x2='616.4177772475912' y2='262.8849561253843' stroke='#6b7260' stroke-width='1' stroke-dasharray='3 3'/>
<path d='M426,263 L616,263' fill='none' stroke='#d32f2f' stroke-width='3.5' marker-end='url(#ahr)'/>
<text x='628.4177772475912' y='267.8849561253843' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#d32f2f'>Full push from the spin</text><text x='628.4177772475912' y='285.8849561253843' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#d32f2f'>(straight out from the axis)</text>
<path d='M426,263 L538,169' fill='none' stroke='#2e7d32' stroke-width='3.5' marker-end='url(#ahg)'/>
<text x='561.9143541259496' y='165.32821958922455' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#2e7d32'>EÖTVÖS EFFECT</text><text x='561.9143541259496' y='183.32821958922455' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#2e7d32'>the upward part: the shell</text><text x='561.9143541259496' y='201.32821958922455' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#2e7d32'>stays up longer and lands LONG</text>
<path d='M426,263 L505,356' fill='none' stroke='#20261c' stroke-width='3.5' marker-end='url(#ah)'/>
<text x='516.9212003692328' y='366.44169266154404' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c'>CORIOLIS EFFECT</text><text x='516.9212003692328' y='384.44169266154404' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c'>the part along the ground:</text><text x='516.9212003692328' y='402.44169266154404' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c'>sideways drift</text>
<circle cx='426' cy='263' r='6' fill='#20261c'/>
<text x='408.41777724759123' y='228.8849561253843' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c'>Gun, firing east</text><text x='408.41777724759123' y='246.8849561253843' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c'>(into the page)</text>
<text x='800' y='440' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Fire east: the push lifts the shell, it lands long.</text><text x='800' y='458' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Fire west: the push is reversed, it lands short.</text>
</svg>
