<rect x='30' y='70' width='50' height='33.6' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='55.0' y='91.7' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#fff'>#</text><rect x='80' y='70' width='380' height='33.6' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='270.0' y='91.7' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#fff'>Column</text><rect x='460' y='70' width='330' height='33.6' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='625.0' y='91.7' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#fff'>Worked example</text><rect x='30' y='103.6' width='50' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='38' y='125.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>1</text><rect x='80' y='103.6' width='380' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='88' y='125.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Charge</text><rect x='460' y='103.6' width='330' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='468' y='125.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'></text><rect x='30' y='133.0' width='50' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='38' y='155.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>2</text><rect x='80' y='133.0' width='380' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='88' y='155.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Range from the mortar to the target</text><rect x='460' y='133.0' width='330' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='468' y='155.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'></text><rect x='30' y='162.4' width='50' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='38' y='184.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>3</text><rect x='80' y='162.4' width='380' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='88' y='184.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Tube elevation for that range (mils)</text><rect x='460' y='162.4' width='330' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='468' y='184.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'></text><rect x='30' y='191.8' width='50' height='65.8' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='38' y='213.8' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>4</text><rect x='80' y='191.8' width='380' height='65.8' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='88' y='213.8' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Elevation change per 100 m of height</text><text x='88' y='232.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>difference. Add if the target is lower,</text><text x='88' y='250.20000000000002' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>subtract if it is higher</text><rect x='460' y='191.8' width='330' height='65.8' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='468' y='213.8' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Example: target at 1 m, mortar at 101 m</text><text x='468' y='232.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>(target 100 m lower) - add 112 to</text><text x='468' y='250.20000000000002' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>the tube elevation</text><rect x='30' y='257.6' width='50' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='38' y='279.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>5</text><rect x='80' y='257.6' width='380' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='88' y='279.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Change in flight time per 100 m</text><rect x='460' y='257.6' width='330' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='468' y='279.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'></text><rect x='30' y='287.0' width='50' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='38' y='309.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>6</text><rect x='80' y='287.0' width='380' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='88' y='309.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Time of flight (seconds)</text><rect x='460' y='287.0' width='330' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='468' y='309.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'></text><rect x='30' y='316.4' width='50' height='47.599999999999994' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='38' y='338.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>7</text><rect x='80' y='316.4' width='380' height='47.599999999999994' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='88' y='338.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Crosswind correction per 1 mph, in mils.</text><text x='88' y='356.59999999999997' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Wind to the right: add. To the left: subtract</text><rect x='460' y='316.4' width='330' height='47.599999999999994' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='468' y='338.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Example: 5 mph wind blowing left to</text><text x='468' y='356.59999999999997' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>right - add 3 mils</text><rect x='30' y='364.0' width='50' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='38' y='386.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>8</text><rect x='80' y='364.0' width='380' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='88' y='386.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Head wind / tail wind correction per 1 mph</text><rect x='460' y='364.0' width='330' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='468' y='386.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'></text>
