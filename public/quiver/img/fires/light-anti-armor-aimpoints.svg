<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 870 387' width='870' height='387' role='img' aria-label='Light anti-armour aim points on buildings and bunkers, what each does and how to fire'>
<title>Light anti-armour aim points on buildings and bunkers, what each does and how to fire</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='870' height='387' fill='#ffffff'/>
<rect x='20' y='20' width='150' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='95.0' y='40.15' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Aim at</text><rect x='170' y='20' width='380' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='360.0' y='40.15' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>What the rocket does</text><rect x='550' y='20' width='300' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='700.0' y='40.15' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>How to fire</text><rect x='20' y='51.2' width='150' height='63.300000000000004' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='29' y='73.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Firing port or</text><text x='29' y='90.10000000000001' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>loophole</text><rect x='170' y='51.2' width='380' height='63.300000000000004' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='179' y='73.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Bursts at the back of the position: little</text><text x='179' y='90.10000000000001' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>damage to it, the gear or the people inside</text><text x='179' y='107.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>unless they take a direct hit. Wasted.</text><rect x='550' y='51.2' width='300' height='63.300000000000004' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='559' y='73.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='20' y='114.5' width='150' height='63.300000000000004' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='29' y='136.5' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Berm</text><rect x='170' y='114.5' width='380' height='63.300000000000004' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='179' y='136.5' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Bursts outside or inside the berm: a small</text><text x='179' y='153.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>hole and dust, nobody hurt unless hit</text><text x='179' y='170.3' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>directly.</text><rect x='550' y='114.5' width='300' height='63.300000000000004' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='559' y='136.5' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='20' y='177.8' width='150' height='63.300000000000004' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='29' y='199.8' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Window</text><rect x='170' y='177.8' width='380' height='63.300000000000004' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='179' y='199.8' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>May fly right through before it goes off;</text><text x='179' y='216.70000000000002' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>if not, dust and minor damage to the back</text><text x='179' y='233.60000000000002' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>wall. Few casualties.</text><rect x='550' y='177.8' width='300' height='63.300000000000004' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='559' y='199.8' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='20' y='241.10000000000002' width='150' height='46.400000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='29' y='263.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Wall</text><rect x='170' y='241.10000000000002' width='380' height='46.400000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='179' y='263.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Goes off on contact: dust, a small hole,</text><text x='179' y='280.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>little harm to anyone inside.</text><rect x='550' y='241.10000000000002' width='300' height='46.400000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='559' y='263.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='20' y='287.5' width='150' height='80.2' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='29' y='309.5' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Corner</text><rect x='170' y='287.5' width='380' height='80.2' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='179' y='309.5' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Corners are reinforced, so the rocket goes</text><text x='179' y='326.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>off sooner. It should burst in the room you</text><text x='179' y='343.3' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>want: dust and overpressure can stun the</text><text x='179' y='360.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>people near it.</text><rect x='550' y='287.5' width='300' height='80.2' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='559' y='309.5' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='550' y='51.2' width='300' height='126.60000000000001' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='559' y='73.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Fire the rocket 15 to 30 cm</text><text x='559' y='90.10000000000001' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>(6 to 12 in) in front of the</text><text x='559' y='107.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>firing port, into the berm.</text><text x='559' y='123.9' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Keep small arms on the</text><text x='559' y='140.8' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>position so nobody inside can</text><text x='559' y='157.7' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>fire back with their own AT.</text><rect x='550' y='177.8' width='300' height='189.9' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='559' y='199.8' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Aim 15 to 30 cm (6 to 12 in)</text><text x='559' y='216.70000000000002' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>in from the side or bottom of</text><text x='559' y='233.60000000000002' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>the window. The rocket bursts</text><text x='559' y='250.5' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>on brick or concrete and</text><text x='559' y='267.40000000000003' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>blows a hole; the warhead</text><text x='559' y='284.3' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>decides how big.</text>
</svg>
