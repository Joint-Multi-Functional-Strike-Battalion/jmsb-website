<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 810 224' width='810' height='224' role='img' aria-label='Types of vehicle kill: mobility, firepower and catastrophic, and what the vehicle can still do after each'>
<title>Types of vehicle kill: mobility, firepower and catastrophic, and what the vehicle can still do after each</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='810' height='224' fill='#ffffff'/>
<rect x='20' y='20' width='170' height='33.6' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='105.0' y='41.699999999999996' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#fff'>Kill</text><rect x='190' y='20' width='300' height='33.6' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='340.0' y='41.699999999999996' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#fff'>What is hit</text><rect x='490' y='20' width='300' height='33.6' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='640.0' y='41.699999999999996' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#fff'>What the vehicle can still do</text><rect x='20' y='53.6' width='170' height='50.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='30' y='77.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Mobility kill</text><rect x='190' y='53.6' width='300' height='50.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='200' y='77.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Tracks, wheels, suspension,</text><text x='200' y='95.8' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>engine or gearbox</text><rect x='490' y='53.6' width='300' height='50.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='500' y='77.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Cannot move, CAN still shoot.</text><text x='500' y='95.8' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Stay out of its arc.</text><rect x='20' y='104.0' width='170' height='50.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='30' y='128.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Firepower kill</text><rect x='190' y='104.0' width='300' height='50.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='200' y='128.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Main gun or its controls</text><rect x='490' y='104.0' width='300' height='50.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='500' y='128.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Cannot fight, CAN still drive</text><text x='500' y='146.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>away. Finish it or let it go.</text><rect x='20' y='154.4' width='170' height='50.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='30' y='178.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Catastrophic kill</text><rect x='190' y='154.4' width='300' height='50.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='200' y='178.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Ammunition or fuel stowage,</text><text x='200' y='196.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>usually by more than one hit</text><rect x='490' y='154.4' width='300' height='50.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='500' y='178.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Nothing: the vehicle</text><text x='500' y='196.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>is destroyed.</text>
</svg>
