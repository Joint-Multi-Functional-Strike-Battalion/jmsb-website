<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 470' width='820' height='470' role='img' aria-label='Linear ambush: three teams in one line, each firing straight into the kill zone in front'>
<title>Linear ambush: three teams in one line, each firing straight into the kill zone in front</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='820' height='470' fill='#ffffff'/>
<text x='410.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>LINEAR AMBUSH  -  the teams in one line, all firing into the kill zone</text><text x='410.0' y='52' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Simple to set and to control. The enemy is hit from one side.</text><rect x='40' y='300' width='740' height='70' fill='#c8b98f' opacity='.45'/><text x='60' y='390' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='normal' fill='#6b7260'>road / trail</text><path d='M210,120 L324,365 A270,270 0 0 1 96,365 z' fill='#2e7d32' opacity='0.13' stroke='#2e7d32' stroke-width='1.5'/><path d='M410,120 L524,365 A270,270 0 0 1 296,365 z' fill='#2e7d32' opacity='0.13' stroke='#2e7d32' stroke-width='1.5'/><path d='M610,120 L724,365 A270,270 0 0 1 496,365 z' fill='#2e7d32' opacity='0.13' stroke='#2e7d32' stroke-width='1.5'/><rect x='120' y='285' width='580' height='100' rx='6' fill='none' stroke='#d32f2f' stroke-width='3' stroke-dasharray='10 7'/><text x='410.0' y='340.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#d32f2f'>KILL ZONE</text><rect x='186.0' y='94.0' width='48' height='32' rx='0' fill='#fff' stroke='#20261c' stroke-width='2'/><line x1='186.0' y1='94.0' x2='234.0' y2='126.0' stroke='#20261c' stroke-width='2'/><line x1='186.0' y1='126.0' x2='234.0' y2='94.0' stroke='#20261c' stroke-width='2'/><text x='210' y='144' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>Team</text><rect x='386.0' y='94.0' width='48' height='32' rx='0' fill='#fff' stroke='#20261c' stroke-width='2'/><line x1='386.0' y1='94.0' x2='434.0' y2='126.0' stroke='#20261c' stroke-width='2'/><line x1='386.0' y1='126.0' x2='434.0' y2='94.0' stroke='#20261c' stroke-width='2'/><text x='410' y='144' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>Team</text><rect x='586.0' y='94.0' width='48' height='32' rx='0' fill='#fff' stroke='#20261c' stroke-width='2'/><line x1='586.0' y1='94.0' x2='634.0' y2='126.0' stroke='#20261c' stroke-width='2'/><line x1='586.0' y1='126.0' x2='634.0' y2='94.0' stroke='#20261c' stroke-width='2'/><text x='610' y='144' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>Team</text><path d='M60,338 L150,338' fill='none' stroke='#d32f2f' stroke-width='3' marker-end='url(#ahr)'/><text x='60' y='326' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#d32f2f'>enemy</text><text x='410.0' y='425' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Each team has its own slice of the kill zone; the slices touch so nothing gets through.</text><text x='410.0' y='443' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Ground on the far side that offers the enemy shelter is mined or covered by mortars.</text>
</svg>
