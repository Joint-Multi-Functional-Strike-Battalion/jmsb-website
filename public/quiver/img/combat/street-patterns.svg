<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 809.2' width='860' height='809.2' role='img' aria-label='Street patterns: rectangular, rayed, radial, radial-ring, contour-following, irregular, combined and linear, with a pictogram and the effect of each'>
<title>Street patterns: rectangular, rayed, radial, radial-ring, contour-following, irregular, combined and linear, with a pictogram and the effect of each</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='860' height='809.2' fill='#ffffff'/>
<text x='430.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>STREET PATTERNS</text><text x='430.0' y='52' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>How a town&#39;s streets are laid out shapes how you move and fight through it</text><rect x='20' y='70' width='110' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='75.0' y='90.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Shape</text><rect x='130' y='70' width='140' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='200.0' y='90.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Pattern</text><rect x='270' y='70' width='570' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='555.0' y='90.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>What it means</text><rect x='20' y='101.2' width='110' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='122.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='130' y='101.2' width='140' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='138' y='122.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Rectangular</text><text x='138' y='139.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>(chessboard)</text><rect x='270' y='101.2' width='570' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='278' y='122.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Straight streets crossing at right angles, making a grid of blocks.</text><text x='278' y='139.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Easy to navigate; long, straight fields of fire down every street.</text><rect x='20' y='187.2' width='110' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='28' y='208.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='130' y='187.2' width='140' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='138' y='208.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Rayed</text><rect x='270' y='187.2' width='570' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='278' y='208.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Streets fan out from one focal point, but through less than a full circle.</text><text x='278' y='225.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Every street leads back to the same place.</text><rect x='20' y='273.2' width='110' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='294.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='130' y='273.2' width='140' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='138' y='294.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Radial</text><rect x='270' y='273.2' width='570' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='278' y='294.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Main roads spread out from a centre like spokes - all the way round,</text><text x='278' y='311.09999999999997' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>or through an arc when a coast or river blocks one side.</text><rect x='20' y='359.2' width='110' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='28' y='380.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='130' y='359.2' width='140' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='138' y='380.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Radial-ring</text><rect x='270' y='359.2' width='570' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='278' y='380.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Rings of road, each bigger than the last, crossed by spokes from the centre.</text><text x='278' y='397.09999999999997' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Usually part of a larger radial layout.</text><rect x='20' y='445.2' width='110' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='466.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='130' y='445.2' width='140' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='138' y='466.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Contour-</text><text x='138' y='483.09999999999997' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>following</text><rect x='270' y='445.2' width='570' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='278' y='466.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Steep ground decides the roads: main streets run along the slope,</text><text x='278' y='483.09999999999997' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>short steep links connect them.</text><rect x='20' y='531.2' width='110' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='28' y='552.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='130' y='531.2' width='140' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='138' y='552.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Irregular</text><rect x='270' y='531.2' width='570' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='278' y='552.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>No geometric plan, by design. Curving streets and dead ends</text><text x='278' y='569.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>(a modern housing estate is a typical example). Easy to get lost.</text><rect x='20' y='617.2' width='110' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='638.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='130' y='617.2' width='140' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='138' y='638.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Combined</text><rect x='270' y='617.2' width='570' height='86' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='278' y='638.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>A mix of the patterns above - often an old town centre ringed</text><text x='278' y='655.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>by newer high-rise and business districts.</text><rect x='20' y='703.2' width='110' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='28' y='724.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'></text><rect x='130' y='703.2' width='140' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='138' y='724.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Linear</text><rect x='270' y='703.2' width='570' height='86' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='278' y='724.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>One main road down the middle with buildings strung along both sides,</text><text x='278' y='741.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>like a strip mall or a village high street.</text><rect x='41.0' y='110.19999999999999' width='15' height='15' fill='#3a4433'/><rect x='41.0' y='127.69999999999999' width='15' height='15' fill='#3a4433'/><rect x='41.0' y='145.2' width='15' height='15' fill='#3a4433'/><rect x='41.0' y='162.7' width='15' height='15' fill='#3a4433'/><rect x='58.5' y='110.19999999999999' width='15' height='15' fill='#3a4433'/><rect x='58.5' y='127.69999999999999' width='15' height='15' fill='#3a4433'/><rect x='58.5' y='145.2' width='15' height='15' fill='#3a4433'/><rect x='58.5' y='162.7' width='15' height='15' fill='#3a4433'/><rect x='76.0' y='110.19999999999999' width='15' height='15' fill='#3a4433'/><rect x='76.0' y='127.69999999999999' width='15' height='15' fill='#3a4433'/><rect x='76.0' y='145.2' width='15' height='15' fill='#3a4433'/><rect x='76.0' y='162.7' width='15' height='15' fill='#3a4433'/><rect x='93.5' y='110.19999999999999' width='15' height='15' fill='#3a4433'/><rect x='93.5' y='127.69999999999999' width='15' height='15' fill='#3a4433'/><rect x='93.5' y='145.2' width='15' height='15' fill='#3a4433'/><rect x='93.5' y='162.7' width='15' height='15' fill='#3a4433'/><path d='M49,230.2 L84,189 L90,195 L96,203 L100,212 L102,221 L103,230 L102,240 L100,249 L96,257 L90,265 L84,272 z' fill='#3a4433'/><path d='M49,230.2 L92,194' stroke='#fff' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M49,230.2 L102,211' stroke='#fff' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M49,230.2 L105,230' stroke='#fff' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M49,230.2 L102,249' stroke='#fff' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M49,230.2 L92,266' stroke='#fff' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M108,330 L89,349 L61,349 L42,330 L42,302 L61,283 L89,283 L108,302 z' fill='#3a4433'/><path d='M75,316.2 L111,316' stroke='#fff' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M75,316.2 L100,342' stroke='#fff' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M75,316.2 L75,352' stroke='#fff' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M75,316.2 L50,342' stroke='#fff' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M75,316.2 L39,316' stroke='#fff' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M75,316.2 L50,291' stroke='#fff' stroke-widt