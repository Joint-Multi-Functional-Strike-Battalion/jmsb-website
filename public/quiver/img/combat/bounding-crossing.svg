<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 520 620' width='520' height='620' role='img' aria-label='Crossing: if you cannot pass behind a shooter, call crossing so he holds fire while you pass in front'>
<title>Crossing: if you cannot pass behind a shooter, call crossing so he holds fire while you pass in front</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='520' height='620' fill='#ffffff'/>
<text x='260.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>CROSSING - when you cannot get behind him</text>
<text x='260.0' y='62' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#d32f2f'>ENEMY</text><line x1='30' y1='70' x2='490' y2='70' stroke='#d32f2f' stroke-width='2' stroke-dasharray='8 6'/>
<path d='M215,380 L145,99 A290,290 0 0 1 285,99 z' fill='#d32f2f' opacity='0.14' stroke='#d32f2f' stroke-width='1.5'/>
<rect x='113.0' y='207.0' width='74' height='18' rx='3' fill='#9e9e94' stroke='#20261c' stroke-width='1'/><text x='150' y='220.5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#fff'>cover</text>
<rect x='178.0' y='345.0' width='74' height='18' rx='3' fill='#9e9e94' stroke='#20261c' stroke-width='1'/><text x='215' y='358.5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#fff'>cover</text>
<rect x='263.0' y='441.0' width='74' height='18' rx='3' fill='#9e9e94' stroke='#20261c' stroke-width='1'/><text x='300' y='454.5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#fff'>cover</text>
<rect x='383.0' y='291.0' width='74' height='18' rx='3' fill='#9e9e94' stroke='#20261c' stroke-width='1'/><text x='420' y='304.5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#fff'>cover</text>
<path d='M215.0,364.0 L221.5,384.7 L208.5,384.7 z' fill='#d32f2f'/><circle cx='215' cy='380' r='9' fill='#d32f2f'/>
<text x='110' y='410' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#d32f2f'>stops firing</text>
<path d='M296,462 C280,380 230,330 228,290 S195,256 172,248' fill='none' stroke='#2e7d32' stroke-width='2.4' marker-end='url(#ahg)'/>
<path d='M300.0,460.0 L306.5,480.7 L293.5,480.7 z' fill='#2e7d32'/><circle cx='300' cy='476' r='9' fill='#2e7d32'/>
<text x='320' y='482' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#2e7d32'>CROSSING!</text>
<path d='M150.0,226.0 L156.5,246.7 L143.5,246.7 z' fill='#2e7d32'/><circle cx='150' cy='242' r='9' fill='#2e7d32'/>
<text x='260.0' y='560' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Rock or wall in the way behind him? Call CROSSING first.</text><text x='260.0' y='578' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>He holds fire until you are clear of his muzzle.</text>
</svg>
