<path d='M434.0,536.0 L427.5,515.3 L440.5,515.3 z' fill='#d32f2f'/><circle cx='434' cy='520' r='9' fill='#d32f2f'/>
<path d='M506.0,536.0 L499.5,515.3 L512.5,515.3 z' fill='#d32f2f'/><circle cx='506' cy='520' r='9' fill='#d32f2f'/>
