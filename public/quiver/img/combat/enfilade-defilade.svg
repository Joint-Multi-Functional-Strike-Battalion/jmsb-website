<path d='M650.0,536.0 L643.5,515.3 L656.5,515.3 z' fill='#d32f2f'/><circle cx='650' cy='520' r='9' fill='#d32f2f'/>
<text x='470' y='486' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#d32f2f'>Enemy position</text>
<path d='M470.0,604.0 L476.5,624.7 L463.5,624.7 z' fill='#2e7d32'/><circle cx='470' cy='620' r='9' fill='#2e7d32'/>
<path d='M470,602 L470,542' fill='none' stroke='#2e7d32' stroke-width='2' stroke-dasharray='6 5' marker-end='url(#ahg)'/>
<text x='470' y='648' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Frontal: the burst hits one man</text>
<path d='M156.0,520.0 L135.3,526.5 L135.3,513.5 z' fill='#2e7d32'/><circle cx='140' cy='520' r='9' fill='#2e7d32'/>
<ellipse cx='470' cy='520' rx='225' ry='22' fill='none' stroke='#2e7d32' stroke-width='2' stroke-dasharray='6 4'/>
<path d='M158,520 L238,520' fill='none' stroke='#2e7d32' stroke-width='2.5' marker-end='url(#ahg)'/>
<text x='140' y='560' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#2e7d32'>Enfilade: the beaten</text><text x='140' y='578' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#2e7d32'>zone lies along the line</text>
</svg>
