<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 470' width='820' height='470' role='img' aria-label='Soft dismount: drivers and gunners stay in, the rest get out and take up all-round security'>
<title>Soft dismount: drivers and gunners stay in, the rest get out and take up all-round security</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='820' height='470' fill='#ffffff'/>
<text x='410.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>SOFT DISMOUNT  -  drivers and gunners stay in</text><text x='410.0' y='52' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Everyone else gets out and pulls 360 security around the vehicle</text><rect x='0' y='190' width='820' height='110' fill='#cfcfcf'/><line x1='0' y1='245.0' x2='820' y2='245.0' stroke='#fff' stroke-width='4' stroke-dasharray='30 30'/><g transform='translate(230,245) rotate(0)'><rect x='-55.0' y='-29.0' width='110' height='58' rx='5' fill='#c2a878' stroke='#20261c' stroke-width='1.5'/><rect x='41.0' y='-25.0' width='9' height='50' rx='2' fill='#3a4433'/></g><path d='M208,222 L122,128' fill='none' stroke='#2e7d32' stroke-width='3' marker-end='url(#ahg)'/><path d='M97.7,98.7 L116.0,110.4 L106.1,118.8 z' fill='#2e7d32'/><circle cx='108' cy='111' r='9' fill='#2e7d32'/><path d='M208,268 L122,362' fill='none' stroke='#2e7d32' stroke-width='3' marker-end='url(#ahg)'/><path d='M97.7,391.3 L106.1,371.2 L116.0,379.6 z' fill='#2e7d32'/><circle cx='108' cy='379' r='9' fill='#2e7d32'/><text x='222' y='241' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>driver +</text><text x='222' y='256' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>gunner in</text><g transform='translate(590,245) rotate(0)'><rect x='-55.0' y='-29.0' width='110' height='58' rx='5' fill='#c2a878' stroke='#20261c' stroke-width='1.5'/><rect x='41.0' y='-25.0' width='9' height='50' rx='2' fill='#3a4433'/></g><path d='M612,222 L698,128' fill='none' stroke='#1565c0' stroke-width='3' marker-end='url(#ahb)'/><path d='M722.3,98.7 L713.9,118.8 L704.0,110.4 z' fill='#1565c0'/><circle cx='712' cy='111' r='9' fill='#1565c0'/><path d='M612,268 L698,362' fill='none' stroke='#1565c0' stroke-width='3' marker-end='url(#ahb)'/><path d='M722.3,391.3 L704.0,379.6 L713.9,371.2 z' fill='#1565c0'/><circle cx='712' cy='379' r='9' fill='#1565c0'/><text x='582' y='241' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>driver +</text><text x='582' y='256' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>gunner in</text><text x='410.0' y='458' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Each man faces out, away from the vehicle, and covers his own arc.</text>
</svg>
