<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 480' width='820' height='480' role='img' aria-label='Coil: the lead vehicle faces forward, two turn to the flanks and the last turns round to face the rear'>
<title>Coil: the lead vehicle faces forward, two turn to the flanks and the last turns round to face the rear</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='820' height='480' fill='#ffffff'/>
<text x='410.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>COIL  -  the vehicles turn out to face every direction</text><text x='410.0' y='52' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>A tight all-round halt: front, rear and both flanks covered</text><rect x='0' y='200' width='820' height='90' fill='#cfcfcf'/><line x1='0' y1='245.0' x2='820' y2='245.0' stroke='#fff' stroke-width='4' stroke-dasharray='30 30'/><path d='M30,92 L180,92' fill='none' stroke='#20261c' stroke-width='5' marker-end='url(#ah)'/><text x='30' y='80' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>DIRECTION OF TRAVEL</text><path d='M420,245 L660,245' fill='none' stroke='#d32f2f' stroke-width='4' marker-end='url(#ahr)'/><g transform='translate(710,245) rotate(0)'><rect x='-37.0' y='-20.0' width='74' height='40' rx='5' fill='#c2a878' stroke='#20261c' stroke-width='1.5'/><rect x='23.0' y='-16.0' width='9' height='32' rx='2' fill='#3a4433'/><text x='-4' y='5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c' transform='rotate(0 -4 0)'>1</text></g><path d='M390,245 Q420,245 420,215 L420,165' fill='none' stroke='#2e7d32' stroke-width='4' marker-end='url(#ahg)'/><g transform='translate(420,120) rotate(-90)'><rect x='-37.0' y='-20.0' width='74' height='40' rx='5' fill='#c2a878' stroke='#20261c' stroke-width='1.5'/><rect x='23.0' y='-16.0' width='9' height='32' rx='2' fill='#3a4433'/><text x='-4' y='5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c' transform='rotate(90 -4 0)'>2</text></g><path d='M360,245 Q390,245 390,275 L390,325' fill='none' stroke='#1565c0' stroke-width='4' marker-end='url(#ahb)'/><g transform='translate(390,370) rotate(90)'><rect x='-37.0' y='-20.0' width='74' height='40' rx='5' fill='#c2a878' stroke='#20261c' stroke-width='1.5'/><rect x='23.0' y='-16.0' width='9' height='32' rx='2' fill='#3a4433'/><text x='-4' y='5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c' transform='rotate(-90 -4 0)'>3</text></g><path d='M200,267 L290,267 C340,267 340,225 290,225 L185,225' fill='none' stroke='#20261c' stroke-width='4' marker-end='url(#ah)'/><g transform='translate(140,225) rotate(180)'><rect x='-37.0' y='-20.0' width='74' height='40' rx='5' fill='#c2a878' stroke='#20261c' stroke-width='1.5'/><rect x='23.0' y='-16.0' width='9' height='32' rx='2' fill='#3a4433'/><text x='-4' y='5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c' transform='rotate(-180 -4 0)'>4</text></g><text x='410.0' y='466' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>No. 1 keeps going and faces the front; 2 and 3 turn to the flanks; 4 turns round to face the rear.</text>
</svg>
