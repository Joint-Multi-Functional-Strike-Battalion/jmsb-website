<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 520 660' width='520' height='660' role='img' aria-label='Bounding: the man moving calls moving and crosses behind the man covering, then calls set'>
<title>Bounding: the man moving calls moving and crosses behind the man covering, then calls set</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='520' height='660' fill='#ffffff'/>
<text x='260.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>BOUNDING - cross BEHIND the man who is firing</text>
<text x='260.0' y='62' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#d32f2f'>ENEMY</text><line x1='30' y1='70' x2='490' y2='70' stroke='#d32f2f' stroke-width='2' stroke-dasharray='8 6'/>
<path d='M300,400 L227,109 A300,300 0 0 1 373,109 z' fill='#2e7d32' opacity='0.14' stroke='#2e7d32' stroke-width='1.5'/>
<rect x='263.0' y='365.0' width='74' height='18' rx='3' fill='#9e9e94' stroke='#20261c' stroke-width='1'/><text x='300' y='378.5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#fff'>cover</text>
<rect x='123.0' y='265.0' width='74' height='18' rx='3' fill='#9e9e94' stroke='#20261c' stroke-width='1'/><text x='160' y='278.5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#fff'>cover</text>
<rect x='373.0' y='465.0' width='74' height='18' rx='3' fill='#9e9e94' stroke='#20261c' stroke-width='1'/><text x='410' y='478.5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#fff'>cover</text>
<rect x='383.0' y='161.0' width='74' height='18' rx='3' fill='#9e9e94' stroke='#20261c' stroke-width='1'/><text x='420' y='174.5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#fff'>cover</text>
<text x='300' y='120' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#2e7d32'>his fire</text>
<path d='M300.0,384.0 L306.5,404.7 L293.5,404.7 z' fill='#2e7d32'/><circle cx='300' cy='400' r='9' fill='#2e7d32'/>
<text x='318' y='418' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#2e7d32'>covering</text>
<path d='M402,512 C350,600 200,590 180,470 S165,340 162,318' fill='none' stroke='#d32f2f' stroke-width='2.4' marker-end='url(#ahr)'/>
<path d='M410.0,484.0 L416.5,504.7 L403.5,504.7 z' fill='#d32f2f'/><circle cx='410' cy='500' r='9' fill='#d32f2f'/>
<text x='428' y='506' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#d32f2f'>MOVING!</text>
<path d='M160.0,284.0 L166.5,304.7 L153.5,304.7 z' fill='#d32f2f'/><circle cx='160' cy='300' r='9' fill='#d32f2f'/>
<text x='100' y='336' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#d32f2f'>SET!</text>
<text x='260.0' y='612' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Call MOVING, then go round the back of the shooter -</text><text x='260.0' y='630' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>never through his line of fire. In cover, firing: SET.</text>
</svg>
