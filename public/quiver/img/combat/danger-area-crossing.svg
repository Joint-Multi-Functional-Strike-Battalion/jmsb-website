<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 620' width='900' height='620' role='img' aria-label='Crossing a danger area: near-side security, the far-side team clears, the unit crosses, security collected'>
<title>Crossing a danger area: near-side security, the far-side team clears, the unit crosses, security collected</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='900' height='620' fill='#ffffff'/>
<text x='450.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>CROSSING A DANGER AREA</text>
<text x='150.0' y='70' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#20261c'>1. Halt, post near-side security</text>
<text x='150.0' y='92' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Flank security out on the near side.</text><text x='150.0' y='110' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>The far-side team crosses and clears.</text>
<rect x='6' y='300' width='288' height='70' fill='#c8b98f' opacity='.6'/>
<line x1='6' y1='300' x2='294' y2='300' stroke='#20261c' stroke-width='1.5' stroke-dasharray='7 5'/>
<line x1='6' y1='370' x2='294' y2='370' stroke='#20261c' stroke-width='1.5' stroke-dasharray='7 5'/>
<text x='60' y='340.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#3a4433'>DANGER AREA</text>
<line x1='300' y1='50' x2='300' y2='610' stroke='#d7dbd0' stroke-width='2'/>
<text x='450.0' y='70' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#20261c'>2. Far side clear - cross</text>
<text x='450.0' y='92' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Far-side team watches the flanks.</text><text x='450.0' y='110' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>The unit crosses fast and quiet.</text>
<rect x='306' y='300' width='288' height='70' fill='#c8b98f' opacity='.6'/>
<line x1='306' y1='300' x2='594' y2='300' stroke='#20261c' stroke-width='1.5' stroke-dasharray='7 5'/>
<line x1='306' y1='370' x2='594' y2='370' stroke='#20261c' stroke-width='1.5' stroke-dasharray='7 5'/>
<text x='360' y='340.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#3a4433'>DANGER AREA</text>
<line x1='600' y1='50' x2='600' y2='610' stroke='#d7dbd0' stroke-width='2'/>
<text x='750.0' y='70' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#20261c'>3. Collect security, move on</text>
<text x='750.0' y='92' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Near-side security crosses last.</text><text x='750.0' y='110' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Head count, then on the azimuth.</text>
