' r='9' fill='#6b7260'/><text x='538' y='231' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='bold' fill='#fff'>1</text><text x='435.0' y='311' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c'>2. No. 2 goes the other way</text><path d='M697.0,249 L590,249 L590,84 L840,84 L840,249 L733.0,249' fill='#fafaf7' stroke='#20261c' stroke-width='4' stroke-linejoin='miter'/><path d='M818,227 L600,84 L832,84 z' fill='#2e7d32' opacity='0.18' stroke='#2e7d32' stroke-width='1.5'/><path d='M612,227 L598,84 L830,84 z' fill='#1565c0' opacity='0.18' stroke='#1565c0' stroke-width='1.5'/><path d='M812.5,212.0 L825.7,229.2 L813.5,233.6 z' fill='#2e7d32'/><circle cx='818' cy='227' r='9' fill='#2e7d32'/><text x='818' y='231' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='bold' fill='#fff'>1</text><path d='M617.5,212.0 L616.5,233.6 L604.3,229.2 z' fill='#1565c0'/><circle cx='612' cy='227' r='9' fill='#1565c0'/><text x='612' y='231' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='11' font-weight='bold' fill='#fff'>2</text><text x='715.0' y='311' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c'>3. Both in place, sectors crossing</text>
