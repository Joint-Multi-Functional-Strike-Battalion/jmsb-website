<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 870 329' width='870' height='329' role='img' aria-label='Two-man room clearing, door in the middle of the wall: number 1 enters and goes one way, number 2 the other, then both cover the room'>
