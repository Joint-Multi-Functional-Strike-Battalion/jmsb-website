<text x='430.0' y='545' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Every bound ends inside the overwatch&#39;s range. The Detachment leader stays with the overwatch.</text><text x='430.0' y='563' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>When the bounding Group is set, the roles swap and the next bound begins.</text>
