<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 890 238.2' width='890' height='238.2' role='img' aria-label='Team formations compared: when each is used, and its control, flexibility, fire and security'>
<title>Team formations compared: when each is used, and its control, flexibility, fire and security</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='890' height='238.2' fill='#ffffff'/>
<text x='445.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>TEAM FORMATIONS COMPARED</text><rect x='20' y='52' width='120' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='80.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Formation</text><rect x='140' y='52' width='170' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='225.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Used most</text><rect x='310' y='52' width='90' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='355.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Control</text><rect x='400' y='52' width='140' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='470.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Flexibility</text><rect x='540' y='52' width='210' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='645.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Fire</text><rect x='750' y='52' width='120' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='810.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Security</text><rect x='20' y='83.2' width='120' height='45.0' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='104.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Team wedge</text><rect x='140' y='83.2' width='170' height='45.0' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='148' y='104.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>The basic team</text><text x='148' y='121.10000000000001' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>formation</text><rect x='310' y='83.2' width='90' height='45.0' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='318' y='104.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Easy</text><rect x='400' y='83.2' width='140' height='45.0' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='408' y='104.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Good</text><rect x='540' y='83.2' width='210' height='45.0' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='548' y='104.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Can fire at once in</text><text x='548' y='121.10000000000001' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>any direction</text><rect x='750' y='83.2' width='120' height='45.0' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='758' y='104.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>All-round</text><rect x='20' y='128.2' width='120' height='61.900000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='28' y='149.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Team file</text><rect x='140' y='128.2' width='170' height='61.900000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='148' y='149.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Close terrain, poor</text><text x='148' y='166.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>visibility, thick</text><text x='148' y='183.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>vegetation</text><rect x='310' y='128.2' width='90' height='61.900000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='318' y='149.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Easiest</text><rect x='400' y='128.2' width='140' height='61.900000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='408' y='149.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Less than the</text><text x='408' y='166.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>wedge</text><rect x='540' y='128.2' width='210' height='61.900000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='548' y='149.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Fires to the flanks;</text><text x='548' y='166.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>masks most fire to</text><text x='548' y='183.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>front and rear</text><rect x='750' y='128.2' width='120' height='61.900000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='758' y='149.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Weak front</text><text x='758' y='166.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>and rear</text><rect x='20' y='190.1' width='120' height='28.1' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='211.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Team line</text><rect x='140' y='190.1' width='170' height='28.1' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='148' y='211.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Assaulting</text><rect x='310' y='190.1' width='90' height='28.1' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='318' y='211.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Easy</text><rect x='400' y='190.1' width='140' height='28.1' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='408' y='211.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>None</text><rect x='540' y='190.1' width='210' height='28.1' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='548' y='211.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>To the front only</text><rect x='750' y='190.1' width='120' height='28.1' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='758' y='211.1' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Least</text>
</svg>
