' height='61.900000000000006' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='778' y='334.90000000000003' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>All-round</text>
