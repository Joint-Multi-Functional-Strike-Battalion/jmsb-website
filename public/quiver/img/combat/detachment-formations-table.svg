<text x='455.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>DETACHMENT FORMATIONS COMPARED</text><rect x='20' y='52' width='130' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='85.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Formation</text><rect x='150' y='52' width='160' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='230.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Used most</text><rect x='310' y='52' width='100' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='360.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Control</text><rect x='410' y='52' width='160' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='490.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Flexibility</text><rect x='570' y='52' width='200' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='670.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Fire</text><rect x='770' y='52' width='120' height='31.2' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='830.0' y='72.14999999999999' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#fff'>Security</text><rect x='20' y='83.2' width='130' height='61.900000000000006' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='104.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weigh