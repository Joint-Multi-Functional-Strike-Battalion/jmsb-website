13' font-weight='normal' fill='#20261c'>Good</text><rect x='570' y='207.00000000000003' width='200' height='45.0' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='578' y='228.00000000000003' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Can fire at once in</text><text x='578' y='244.90000000000003' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>any direction</text><rect x='770' y='207.00000000000003' width='120' height='45.0' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='778' y='228.00000000000003' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>All-round</text><rect x='20' y='252.00000000000003' width='130' height='61.900000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='28' y='273.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Group line</text><rect x='150' y='252.00000000000003' width='160' height='61.900000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='158' y='273.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Most firepower to</text><text x='158' y='289.9' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>the front (assault)</text><rect x='310' y='252.00000000000003' width='100' height='61.900000000000006' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='318' y='273.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Less than</text><text x='318' y='289.9' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>the column</text><rect x='4