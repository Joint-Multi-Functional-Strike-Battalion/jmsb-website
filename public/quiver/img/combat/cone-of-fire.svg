<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 350' width='760' height='350' role='img' aria-label='Cone of fire: the rounds of a burst spread out on the way to the target'>
<title>Cone of fire: the rounds of a burst spread out on the way to the target</title>
