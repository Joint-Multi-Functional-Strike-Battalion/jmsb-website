<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 510' width='820' height='510' role='img' aria-label='Herringbone: the vehicles pull off alternately to either side of the road, angled outward'>
<title>Herringbone: the vehicles pull off alternately to either side of the road, angled outward</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='820' height='510' fill='#ffffff'/>
<text x='410.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>HERRINGBONE  -  pull off the road, alternate sides, angled out</text><text x='410.0' y='52' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Used when the convoy halts in a hurry; the road stays clear and every side is covered</text><rect x='0' y='220' width='820' height='90' fill='#cfcfcf'/><line x1='0' y1='265.0' x2='820' y2='265.0' stroke='#fff' stroke-width='4' stroke-dasharray='30 30'/><path d='M30,465 L180,465' fill='none' stroke='#20261c' stroke-width='5' marker-end='url(#ah)'/><text x='30' y='453' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>DIRECTION OF TRAVEL</text><path d='M452,278 L582,278 L652,348' fill='none' stroke='#d32f2f' stroke-width='4' marker-end='url(#ahr)'/><g transform='translate(690,380) rotate(40)'><rect x='-37.0' y='-20.0' width='74' height='40' rx='5' fill='#c2a878' stroke='#20261c' stroke-width='1.5'/><rect x='23.0' y='-16.0' width='9' height='32' rx='2' fill='#3a4433'/><text x='-4' y='5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c' transform='rotate(-40 -4 0)'>1</text></g><path d='M277,252 L407,252 L492,167' fill='none' stroke='#2e7d32' stroke-width='4' marker-end='url(#ahg)'/><g transform='translate(530,135) rotate(-40)'><rect x='-37.0' y='-20.0' width='74' height='40' rx='5' fill='#c2a878' stroke='#20261c' stroke-width='1.5'/><rect x='23.0' y='-16.0' width='9' height='32' rx='2' fill='#3a4433'/><text x='-4' y='5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c' transform='rotate(40 -4 0)'>2</text></g><path d='M92,278 L222,278 L292,348' fill='none' stroke='#1565c0' stroke-width='4' marker-end='url(#ahb)'/><g transform='translate(330,380) rotate(40)'><rect x='-37.0' y='-20.0' width='74' height='40' rx='5' fill='#c2a878' stroke='#20261c' stroke-width='1.5'/><rect x='23.0' y='-16.0' width='9' height='32' rx='2' fill='#3a4433'/><text x='-4' y='5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c' transform='rotate(-40 -4 0)'>3</text></g><path d='M-83,252 L47,252 L132,167' fill='none' stroke='#20261c' stroke-width='4' marker-end='url(#ah)'/><g transform='translate(170,135) rotate(-40)'><rect x='-37.0' y='-20.0' width='74' height='40' rx='5' fill='#c2a878' stroke='#20261c' stroke-width='1.5'/><rect x='23.0' y='-16.0' width='9' height='32' rx='2' fill='#3a4433'/><text x='-4' y='5' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c' transform='rotate(40 -4 0)'>4</text></g><text x='790' y='470' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>No. 1 (the lead) goes right, No. 2 left, and so on down the column.</text>
</svg>
