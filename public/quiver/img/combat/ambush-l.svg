<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 500' width='820' height='500' role='img' aria-label='L ambush: two teams fire across the kill zone and a third team at the end fires along it'>
<title>L ambush: two teams fire across the kill zone and a third team at the end fires along it</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='820' height='500' fill='#ffffff'/>
<text x='410.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>L AMBUSH  -  a long leg fires across the kill zone, a short leg fires along it</text><text x='410.0' y='52' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>The short leg rakes the column from end to end.</text><path d='M400,110 L490,333 A240,240 0 0 1 310,333 z' fill='#2e7d32' opacity='0.13' stroke='#2e7d32' stroke-width='1.5'/><path d='M580,110 L670,333 A240,240 0 0 1 490,333 z' fill='#2e7d32' opacity='0.13' stroke='#2e7d32' stroke-width='1.5'/><path d='M130,245 L723,151 A600,600 0 0 1 723,339 z' fill='#2e7d32' opacity='0.13' stroke='#2e7d32' stroke-width='1.5'/><rect x='300' y='190' width='380' height='110' rx='6' fill='none' stroke='#d32f2f' stroke-width='3' stroke-dasharray='10 7'/><text x='490.0' y='250.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#d32f2f'>KILL ZONE</text><rect x='376.0' y='84.0' width='48' height='32' rx='0' fill='#fff' stroke='#20261c' stroke-width='2'/><line x1='376.0' y1='84.0' x2='424.0' y2='116.0' stroke='#20261c' stroke-width='2'/><line x1='376.0' y1='116.0' x2='424.0' y2='84.0' stroke='#20261c' stroke-width='2'/><text x='400' y='134' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>Team</text><rect x='556.0' y='84.0' width='48' height='32' rx='0' fill='#fff' stroke='#20261c' stroke-width='2'/><line x1='556.0' y1='84.0' x2='604.0' y2='116.0' stroke='#20261c' stroke-width='2'/><line x1='556.0' y1='116.0' x2='604.0' y2='84.0' stroke='#20261c' stroke-width='2'/><text x='580' y='134' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>Team</text><rect x='81.0' y='229.0' width='48' height='32' rx='0' fill='#fff' stroke='#20261c' stroke-width='2'/><line x1='81.0' y1='229.0' x2='129.0' y2='261.0' stroke='#20261c' stroke-width='2'/><line x1='81.0' y1='261.0' x2='129.0' y2='229.0' stroke='#20261c' stroke-width='2'/><text x='105' y='285' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#20261c'>Team</text><text x='490' y='145' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#2e7d32'>LONG LEG fires across</text><text x='210' y='232' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#2e7d32'>SHORT LEG fires along</text><path d='M800,245 L700,245' fill='none' stroke='#d32f2f' stroke-width='4' marker-end='url(#ahr)'/><text x='800' y='230' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#d32f2f'>enemy</text><path d='M490,440 L490,320' fill='none' stroke='#d32f2f' stroke-width='4' marker-end='url(#ahr)'/><text x='500' y='430' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#d32f2f'>enemy</text><text x='410.0' y='480' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Arrows: the ways the enemy can come into the kill zone.</text>
</svg>
