<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 481.5999999999999' width='820' height='481.5999999999999' role='img' aria-label='TFAR default keys and what they do'>
<title>TFAR default keys and what they do</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='820' height='481.5999999999999' fill='#ffffff'/>
<text x='410.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>TFAR KEYS</text>
<rect x='20' y='50' width='250' height='33.6' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='145.0' y='71.7' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#fff'>Keys</text><rect x='270' y='50' width='530' height='33.6' rx='0' fill='#3a4433' stroke='#20261c' stroke-width='1'/><text x='535.0' y='71.7' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#fff'>Action</text><rect x='20' y='83.6' width='250' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='105.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Push-to-talk in TeamSpeak</text><rect x='270' y='83.6' width='530' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='278' y='105.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Direct speech (talking out loud).</text><rect x='20' y='113.0' width='250' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='28' y='135.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Caps Lock</text><rect x='270' y='113.0' width='530' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='278' y='135.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Talk on the radio.</text><rect x='20' y='142.4' width='250' height='65.8' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='164.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Ctrl + P</text><rect x='270' y='142.4' width='530' height='65.8' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='278' y='164.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Open the personal radio (it must be in the radio slot). With several</text><text x='278' y='182.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>radios you pick one, set it as active (the one you transmit on),</text><text x='278' y='200.8' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>or copy settings from another radio with the same encryption code.</text><rect x='20' y='208.2' width='250' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='28' y='230.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Ctrl + + [/]</text><rect x='270' y='208.2' width='530' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='278' y='230.2' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Cycle through the shortwave radios you carry.</text><rect x='20' y='237.6' width='250' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='259.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Ctrl + Up / Left / Right Arrow</text><rect x='270' y='237.6' width='530' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='278' y='259.6' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Quick-switch the shortwave radio&#39;s stereo (ear).</text><rect x='20' y='267.0' width='250' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='28' y='289.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Num 1 - 8</text><rect x='270' y='267.0' width='530' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='278' y='289.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Quick-switch shortwave channels.</text><rect x='20' y='296.4' width='250' height='47.599999999999994' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='318.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Ctrl + Tab</text><rect x='270' y='296.4' width='530' height='47.599999999999994' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='278' y='318.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Change your voice volume: whisper, normal or yell.</text><text x='278' y='336.59999999999997' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Does not change how loud you are on the radio.</text><rect x='20' y='344.0' width='250' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='28' y='366.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Ctrl + ]</text><rect x='270' y='344.0' width='530' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='278' y='366.0' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Next personal radio.</text><rect x='20' y='373.4' width='250' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='395.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Ctrl + [</text><rect x='270' y='373.4' width='530' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='278' y='395.4' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Previous personal radio.</text><rect x='20' y='402.79999999999995' width='250' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='28' y='424.79999999999995' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Ctrl + Left / Up / Right</text><rect x='270' y='402.79999999999995' width='530' height='29.4' rx='0' fill='#eef0ea' stroke='#20261c' stroke-width='1'/><text x='278' y='424.79999999999995' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Change the personal radio&#39;s stereo (ear).</text><rect x='20' y='432.19999999999993' width='250' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='28' y='454.19999999999993' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Esc</text><rect x='270' y='432.19999999999993' width='530' height='29.4' rx='0' fill='#fff' stroke='#20261c' stroke-width='1'/><text x='278' y='454.19999999999993' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='normal' fill='#20261c'>Close the radio interface.</text>
</svg>
