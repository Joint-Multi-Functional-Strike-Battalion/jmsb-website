<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 700' width='880' height='700' role='img' aria-label='Terrain features on a hand: knuckles are hills on a ridge, the dips saddles, fingers spurs, grooves draws, the flat side a cliff; an open hand a valley and a cupped hand a depression'>
<title>Terrain features on a hand: knuckles are hills on a ridge, the dips saddles, fingers spurs, grooves draws, the flat side a cliff; an open hand a valley and a cupped hand a depression</title>
<defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#20261c'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d32f2f'/></marker><marker id='ahg' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2e7d32'/></marker><marker id='ahb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1565c0'/></marker></defs>
<rect width='880' height='700' fill='#ffffff'/>
<text x='440.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='16' font-weight='bold' fill='#20261c'>YOUR FIST IS A MAP  -  the terrain features on one hand</text><text x='440.0' y='52' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#6b7260'>Make a fist, knuckles up: picture each part as ground</text>
<rect x='284' y='310' width='196' height='90' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/>
<rect x='290' y='156' width='46' height='169' rx='22' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/>
<path d='M298,218 Q313.0,226 328,218' fill='none' stroke='#8a6d45' stroke-width='1.5'/>
<rect x='336' y='150' width='46' height='175' rx='22' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/>
<path d='M344,212 Q359.0,220 374,212' fill='none' stroke='#8a6d45' stroke-width='1.5'/>
<rect x='382' y='150' width='46' height='175' rx='22' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/>
<path d='M390,212 Q405.0,220 420,212' fill='none' stroke='#8a6d45' stroke-width='1.5'/>
<rect x='428' y='166' width='46' height='159' rx='22' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/>
<path d='M436,228 Q451.0,236 466,228' fill='none' stroke='#8a6d45' stroke-width='1.5'/>
<rect x='276' y='262' width='148' height='44' rx='22' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/>
<path d='M474,172 L496,190 L496,380 L480,400' fill='#d8bd95' stroke='#8a6d45' stroke-width='2'/>
<path d='M290,136 L290,124 L474,124 L474,136' fill='none' stroke='#20261c' stroke-width='2'/>
<text x='382' y='114' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c'>RIDGE  -  the row of knuckles: a line of high ground</text>
<path d='M594,154 L457.0,162' fill='none' stroke='#20261c' stroke-width='1.8' marker-end='url(#ah)'/>
<text x='600' y='158' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c'>HILL  -  one knuckle top</text>
<path d='M594,194 L384,156' fill='none' stroke='#20261c' stroke-width='1.8' marker-end='url(#ah)'/>
<text x='600' y='198' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#20261c'>SADDLE  -  the dip between two knuckles</text>
<path d='M594,274 L498,280' fill='none' stroke='#20261c' stroke-width='1.8' marker-end='url(#ah)'/>
<text x='600' y='270' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>CLIFF  -  the flat side of the fist:</text><text x='600' y='288' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>near-vertical ground</text>
<path d='M186,196 L309.0,220' fill='none' stroke='#20261c' stroke-width='1.8' marker-end='url(#ah)'/>
<text x='180' y='190' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>SPUR  -  a finger running</text><text x='180' y='208' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>down from a knuckle</text>
<path d='M186,262 L336,242' fill='none' stroke='#20261c' stroke-width='1.8' marker-end='url(#ah)'/>
<text x='180' y='256' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>DRAW  -  the groove</text><text x='180' y='274' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>between two fingers,</text><text x='180' y='292' text-anchor='end' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>down from a saddle</text>
<line x1='40' y1='440' x2='840' y2='440' stroke='#d7dbd0' stroke-width='2'/>
<text x='440.0' y='470' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#20261c'>Now open the hand</text>
<rect x='90' y='456' width='30' height='104' rx='15' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2' transform='rotate(-9.0 105 560)'/><rect x='124' y='444' width='30' height='116' rx='15' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2' transform='rotate(-3.0 139 560)'/><rect x='158' y='448' width='30' height='112' rx='15' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2' transform='rotate(3.0 173 560)'/><rect x='192' y='464' width='30' height='96' rx='15' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2' transform='rotate(9.0 207 560)'/><rect x='84' y='540' width='140' height='120' rx='34' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/><rect x='200' y='580' width='66' height='28' rx='14' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2' transform='rotate(-35 206 594)'/><path d='M154,650 C144,610 164,580 154,530' fill='none' stroke='#1565c0' stroke-width='3'/><path d='M154,630 L154,672' fill='none' stroke='#1565c0' stroke-width='2.5' marker-end='url(#ahb)'/>
<text x='290' y='556' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>VALLEY  -  hand flat,</text><text x='290' y='574' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>fingers spread. High</text><text x='290' y='592' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>ground on three sides;</text><text x='290' y='610' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>water runs out the</text><text x='290' y='628' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>open end.</text>
<rect x='520' y='456' width='30' height='104' rx='15' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/><rect x='554' y='444' width='30' height='116' rx='15' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/><rect x='588' y='448' width='30' height='112' rx='15' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/><rect x='622' y='464' width='30' height='96' rx='15' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/><rect x='514' y='540' width='140' height='120' rx='34' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2'/><rect x='630' y='580' width='66' height='28' rx='14' fill='#e9d3b0' stroke='#8a6d45' stroke-width='2' transform='rotate(-35 636 594)'/><ellipse cx='584' cy='600' rx='42' ry='32' fill='#c9a97e' stroke='#8a6d45' stroke-width='1.5' opacity='1'/><ellipse cx='584' cy='600' rx='24' ry='16' fill='#b38f62' stroke='none' stroke-width='0' opacity='1'/>
<text x='720' y='556' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>DEPRESSION  -</text><text x='720' y='574' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>hand cupped. Low</text><text x='720' y='592' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>ground with high</text><text x='720' y='610' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>ground all round:</text><text x='720' y='628' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>water stays in.</text>
</svg>
