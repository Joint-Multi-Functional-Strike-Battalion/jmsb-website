<text x='40' y='236' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Teams bound into the wood line</text><text x='40' y='254' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>and clear room for the</text><text x='40' y='272' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>whole squad, then re-form.</text>
<text x='560' y='390' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>Open the gaps between</text><text x='560' y='408' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>teams and between men.</text>
<path d='M556,386 L468,400' fill='none' stroke='#20261c' stroke-width='1.5' marker-end='url(#ah)'/>
<text x='40' y='352' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>The road is a danger area inside</text><text x='40' y='370' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>a danger area: cross it in</text><text x='40' y='388' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>traveling overwatch, do NOT</text><text x='40' y='406' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>clear it as a separate</text><text x='40' y='424' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='normal' fill='#20261c'>linear danger area.</text>
